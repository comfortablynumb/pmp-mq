[workspace]
resolver = "2"
members = [
    "crates/pmp-mq-core",
    "crates/pmp-mq-backends",
    "crates/pmp-mq-server",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PMP Team"]
license = "MIT"
repository = "https://github.com/comfortablynumb/pmp-mq"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }
hyper = "1.4"
reqwest = { version = "0.12", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Kafka
rdkafka = { version = "0.36", features = ["tokio"] }

# AWS
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1.45"

# Configuration
config = "0.14"

# Async utilities
futures = "0.3"

# Filtering
jsonpath_lib = "0.3"
regex = "1.10"

# Metrics
prometheus = "0.13"
lazy_static = "1.4"
